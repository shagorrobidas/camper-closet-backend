<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comper Closet | Contact Us</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <div class="logo-icon"></div>
        <span class="logo-text">All Packed</span>
      </div>
      <nav class="nav">
        <a href="#" class="nav-link">Contact</a>
      </nav>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <div class="container">
        <div class="content-wrapper">
          <!-- Left Side - Form -->
          <div class="form-section">
            <div class="contact-header">
              <div class="contact-badge">Contact Us</div>
              <h2 class="section-title">
                Connect with Us: Let's Discuss Your Digital Marketing Needs
              </h2>
            </div>

            <form class="contact-form">
              <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Name" />
              </div>

              <div class="form-group">
                <label for="email">Email*</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Email"
                  required
                />
              </div>

              <div class="form-group">
                <label for="message">Message*</label>
                <textarea
                  id="message"
                  name="message"
                  placeholder="Message"
                  rows="5"
                  required
                ></textarea>
              </div>

              <button type="submit" class="submit-btn">Send Message</button>
            </form>
          </div>

          <!-- Right Side - Illustration -->
          <div class="illustration-section">
            <svg
              class="megaphone-illustration"
              width="350"
              height="350"
              viewBox="0 0 350 350"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <!-- Decorative circles -->
              <circle cx="130" cy="90" r="15" fill="#1e293b" />
              <circle cx="170" cy="110" r="8" fill="#60a5fa" />
              <circle cx="230" cy="170" r="12" fill="#60a5fa" />
              <circle cx="220" cy="320" r="10" fill="#60a5fa" />

              <!-- Megaphone body -->
              <ellipse
                cx="200"
                cy="200"
                rx="120"
                ry="80"
                transform="rotate(-30 200 200)"
                fill="none"
                stroke="#1e293b"
                stroke-width="2"
              />
              <ellipse
                cx="200"
                cy="200"
                rx="100"
                ry="65"
                transform="rotate(-30 200 200)"
                fill="none"
                stroke="#1e293b"
                stroke-width="2"
              />
              <ellipse
                cx="200"
                cy="200"
                rx="80"
                ry="50"
                transform="rotate(-30 200 200)"
                fill="none"
                stroke="#1e293b"
                stroke-width="2"
              />

              <!-- Megaphone cone -->
              <path d="M120 180 L100 260 L180 240 Z" fill="#60a5fa" />
              <path
                d="M120 180 L100 260 L180 240 Z"
                fill="#3b82f6"
                opacity="0.7"
              />
              <rect
                x="95"
                y="255"
                width="20"
                height="60"
                rx="10"
                fill="#1e293b"
              />

              <!-- Star accent -->
              <path
                d="M200 330 L205 340 L210 330 L220 335 L212 325 L220 315 L210 320 L205 310 L200 320 L190 315 L198 325 L190 335 Z"
                fill="#1e293b"
              />
            </svg>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <!-- Wavy top edge -->
      <div class="footer-wave">
        <svg
          viewBox="0 0 1440 120"
          preserveAspectRatio="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M0,120 C180,40 360,100 540,60 C720,20 900,80 1080,50 C1200,30 1320,70 1440,40 L1440,120 L0,120 Z"
            fill="rgba(224,231,255,0.6)"
          />
          <path
            d="M0,120 C200,70 400,110 600,80 C800,50 1000,90 1200,60 C1320,45 1400,75 1440,55 L1440,120 L0,120 Z"
            fill="rgba(241,229,243,0.5)"
          />
        </svg>
      </div>

      <!-- Decorative blobs -->
      <div class="footer-blobs">
        <div class="blob blob-pink"></div>
        <div class="blob blob-blue"></div>
        <div class="blob blob-purple"></div>
      </div>

      <div class="container footer-inner">
        <div class="footer-content">
          <!-- Left - Logo and Description -->
          <div class="footer-left">
            <div class="footer-logo">
              <div class="logo-icon"></div>
              <span class="logo-text">All Packed</span>
            </div>
            <p class="footer-description">
              Nam posuere accumsan porta.<br />
              Integer id orci sed ante tincidunt<br />
              tincidunt sit amet sed libero.
            </p>
            <p class="copyright">© All Packed 2021</p>
          </div>

          <!-- Center - Company Links -->
          <div class="footer-center">
            <h3 class="footer-heading">COMPANY</h3>
            <ul class="footer-links">
              <li><a href="#">About</a></li>
              <li><a href="#">Contact</a></li>
            </ul>
          </div>

          <!-- Right - Social and Language -->
          <div class="footer-right">
            <div class="social-icons">
              <a href="#" class="social-icon"
                ><i class="fab fa-facebook-f"></i
              ></a>
              <a href="#" class="social-icon"
                ><i class="fab fa-linkedin-in"></i
              ></a>
              <a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
              <a href="#" class="social-icon"
                ><i class="fas fa-envelope"></i
              ></a>
            </div>
            <div class="language-selector">
              <span class="globe-icon">🌐</span>
              <select name="language" id="language">
                <option value="en">English - En</option>
                <option value="es">Spanish - Es</option>
                <option value="fr">French - Fr</option>
              </select>
            </div>
          </div>
        </div>
      </div>
      <!-- Dark bottom bar -->
      <div class="footer-bottom-bar"></div>
    </footer>
  </body>
</html>
