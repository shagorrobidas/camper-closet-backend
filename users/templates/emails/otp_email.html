<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fc;
            color: #333;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: #5e60e1;
            font-size: 24px;
            margin-bottom: 20px;
        }
        p {
            font-size: 16px;
            line-height: 1.6;
            margin: 10px 0;
        }
        .otp {
            font-size: 24px;
            font-weight: bold;
            color: #5e60e1;
            padding: 10px;
            background-color: #f0f5ff;
            border-radius: 5px;
            display: inline-block;
        }
        .footer {
            font-size: 14px;
            color: #888;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Your OTP Code</h2>
        
        <p>Hello <strong>{{ user.full_name }}</strong>,</p>
        
        <p>Your OTP for <strong>{{ purpose }}</strong> is:</p>
        <p class="otp">{{ otp }}</p>
        
        <p>This OTP will expire in 10 minutes.</p>
        
        <p>If you didn't request this, please ignore this email.</p>

        <div class="footer">
            <p>Best regards,<br>Comper Closet Team</p>
        </div>
    </div>

</body>
</html>
